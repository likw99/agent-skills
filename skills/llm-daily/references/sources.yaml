sources:
  - name: VentureBeat AI
    category: BUSINESS
    type: rss
    url: "https://venturebeat.com/category/ai/feed/"

  - name: TechCrunch AI
    category: BUSINESS
    type: rss
    url: "https://techcrunch.com/category/artificial-intelligence/feed/"

  - name: Product Hunt (AI Topic)
    category: PRODUCTS
    type: rss
    url: "https://www.producthunt.com/feed?topic=artificial-intelligence"

  - name: Hacker News (AI Related)
    category: PRODUCTS
    type: rss
    url: "https://hnrss.org/newest?q=AI"

  - name: Hugging Face Trending Models
    category: TECHNOLOGY
    type: json_api
    url: "https://huggingface.co/api/models?sort=trendingScore&limit=10"
    parser_config:
      list_path: ""
      title_key: "id"
      link_prefix: "https://huggingface.co/"
      link_key: "id"
      description_key: "pipeline_tag"

  - name: GitHub Recent Top AI Repos
    category: TECHNOLOGY
    type: json_api
    url: "https://api.github.com/search/repositories?q=topic:ai+created:>{last_week_date}&sort=stars&order=desc&per_page=10"
    parser_config:
      list_path: "items"
      title_key: "full_name"
      link_key: "html_url"
      description_key: "description"

  - name: ArXiv LLM Papers
    category: RESEARCH
    type: xml_api
    url: "https://export.arxiv.org/api/query"
    max_items: 10
    parser_config:
      item_tag: "entry"
      title_tag: "title"
      link_tag: "id"
      description_tag: "summary"
      request_params:
        search_query: '(abs:"large language model" OR abs:LLM)'
        sortBy: "submittedDate"
        sortOrder: "descending"
